<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">新竹科學園區三期（科三）進度追蹤</title>
  <desc id="desc">科三目前狀態為修正後送大會，第 6 次專案小組已審竣。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102f2a"/>
      <stop offset="1" stop-color="#1d5f4a"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="990" cy="130" r="190" fill="rgba(217,240,225,0.16)"/>
  <circle cx="1015" cy="132" r="124" fill="none" stroke="#d9f0e1" stroke-width="18" stroke-dasharray="470 160" stroke-linecap="round" transform="rotate(-70 1015 132)"/>
  <rect x="72" y="72" width="88" height="54" rx="10" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.42)"/>
  <text x="116" y="108" fill="#ffffff" text-anchor="middle" font-size="26" font-weight="900" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">科三</text>
  <text x="72" y="184" fill="#b8e0cb" font-size="25" font-weight="900" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">新竹縣政府官方公開資料彙整</text>
  <text x="72" y="276" fill="#ffffff" font-size="72" font-weight="900" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">新竹科學園區三期</text>
  <text x="72" y="366" fill="#ffffff" font-size="72" font-weight="900" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">進度追蹤</text>
  <text x="72" y="438" fill="#e8fff1" font-size="30" font-weight="800" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">目前階段：修正後送大會</text>
  <text x="72" y="486" fill="rgba(255,255,255,0.82)" font-size="25" font-weight="700" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">第 6 次專案小組已審竣，補充資料後送內政部都委會大會</text>
  <g transform="translate(72 535)">
    <rect width="220" height="50" rx="25" fill="#ffffff"/>
    <text x="110" y="33" fill="#15312d" text-anchor="middle" font-size="22" font-weight="900" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">查看最新進度</text>
  </g>
  <g transform="translate(878 420)">
    <rect width="250" height="118" rx="16" fill="rgba(255,255,255,0.95)"/>
    <text x="34" y="47" fill="#65717d" font-size="20" font-weight="800" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">概略進度</text>
    <text x="34" y="94" fill="#15312d" font-size="50" font-weight="900" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">78%</text>
  </g>
</svg>
